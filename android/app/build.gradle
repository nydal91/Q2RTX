plugins {
    id 'com.android.application'
}

// Q2RTX source tree root (this project lives in <root>/android)
def q2rtxRoot = file("../..")
def shadersPkz = file("src/main/assets/shaders.pkz")

android {
    namespace 'io.github.q2rtx'
    compileSdk 34
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "io.github.q2rtx"
        // Vulkan 1.1 entry points are exported by libvulkan from API 28; every phone
        // with hardware ray tracing ships Android 13+ anyway.
        minSdk 29
        targetSdk 34
        versionCode 10812
        versionName "1.8.1-android.12"

        ndk {
            // Ray-tracing capable mobile GPUs are all 64-bit ARM SoCs.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          // 16 KB page alignment, required by newer Android devices
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                          "-DANDROID_PLATFORM=android-29",
                          "-DCONFIG_COMPILE_SHADERS=OFF",
                          "-DCONFIG_USE_CURL=OFF",
                          "-DCONFIG_GL_RENDERER=OFF",
                          "-DCONFIG_VKPT_ENABLE_DEVICE_GROUPS=OFF"
                // libmain.so (engine+client), libgame.so (baseq2 game module), libSDL2.so,
                // and libadrenotools' hook libraries for loading custom GPU drivers
                targets "client", "game", "SDL2",
                        "hook_impl", "main_hook", "file_redirect_hook", "gsl_alloc_hook"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "${q2rtxRoot}/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            // SDL's Java glue (SDLActivity & co.) is used straight from the submodule
            java.srcDirs += ["${q2rtxRoot}/extern/SDL2/android-project/app/src/main/java"]
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            // Sign with the debug key so CI/Release builds install directly.
            // Replace with your own signingConfig before distributing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            // extract the libraries to nativeLibraryDir on install: libadrenotools loads its
            // hook libraries from there by path (needed for custom GPU drivers)
            useLegacyPackaging true
        }
    }

    androidResources {
        // shaders.pkz is a zip already; don't compress it again
        noCompress 'pkz'
    }

    lint {
        abortOnError false
        // release lint only downloads extra tooling and never blocks the build
        checkReleaseBuilds false
    }
}

tasks.register('checkShaders') {
    doLast {
        if (!shadersPkz.exists()) {
            throw new GradleException(
                "Missing ${shadersPkz}.\n" +
                "Compile the SPIR-V shaders on the build host first:  ./build_shaders.sh  (see README.md)")
        }
    }
}
preBuild.dependsOn checkShaders
