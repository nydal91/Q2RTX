name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # GitHub's Ubuntu runners come with the Android SDK in $ANDROID_HOME
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # SPIR-V shaders are built once on the host with glslang from extern/glslang
      - name: Compile shaders
        run: android/build_shaders.sh

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: q2rtx-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
